<!-- ================= Del boceto a tu sala (animación) ================= -->
<section class="process" id="boceto" aria-labelledby="boceto-title">
  <div class="process-head">
    <h2 class="h2" id="boceto-title" data-r>Así nace un mueble a medida</h2>
    <div class="process-copy" data-r>
      <p class="lead">Del trazo en papel al mueble en tu sala: dibujamos con tus medidas, armamos la estructura en el taller y tapizamos con la tela y el color que elijas.</p>
      <div class="process-actions">
        <a class="btn" href="[[wa:Hola Supermuebles Cuenca, quiero un mueble a medida. ¿Me ayudan a empezar con un boceto?]]" target="_blank" rel="noopener noreferrer"><svg class="i" aria-hidden="true"><use href="#i-wa"/></svg><span>Quiero el mío a medida</span></a>
        <a class="link" href="a-medida.html">Cómo trabajamos a medida <svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      </div>
    </div>
  </div>
  <figure class="process-fig" data-r>
    <video id="boceto-video" muted loop playsinline preload="none" poster="img/boceto-poster.jpg" width="1920" height="1080" aria-label="Animación de cuatro etapas: el boceto a lápiz, la estructura de madera, el tapizado en el color que eliges y el sofá terminado en una sala.">
      <source src="video/boceto-a-sofa.mp4" type="video/mp4">
    </video>
  </figure>
  <div class="process-bar">
    <ul class="chaps" aria-label="Etapas de la animación">
      <li><button class="chap" type="button" data-t="0.6" data-cap="Todo empieza con un trazo de lápiz." aria-current="true">Boceto</button></li>
      <li><button class="chap" type="button" data-t="7" data-cap="Madera sólida, armada a mano en nuestro taller.">Estructura</button></li>
      <li><button class="chap" type="button" data-t="10.6" data-cap="Tú eliges la tela y el color.">Tapizado</button></li>
      <li><button class="chap" type="button" data-t="14.6" data-cap="Muebles a medida, fabricados en Cuenca.">Tu sala</button></li>
    </ul>
    <p class="process-cap" id="boceto-cap" aria-hidden="true">Todo empieza con un trazo de lápiz.</p>
    <div class="process-btns">
      <button class="sq sq--full" id="boceto-full" type="button" aria-label="Ver la animación en pantalla completa"><svg class="i" aria-hidden="true"><use href="#i-expand"/></svg></button>
      <button class="sq" id="boceto-toggle" type="button" data-state="paused" aria-label="Reproducir animación"><svg class="i i--fill i-play" aria-hidden="true"><use href="#i-play"/></svg><svg class="i i--fill i-pause" aria-hidden="true"><use href="#i-pause"/></svg></button>
    </div>
  </div>
</section>
